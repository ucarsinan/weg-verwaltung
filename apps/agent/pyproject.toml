[project]
name = "weg-verwaltung-agent"
version = "0.1.0"
description = "WEG-Verwaltung KI-Agent-Service (FastAPI + LangGraph)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "supabase>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # The following are scoped for the next phase (LangGraph topology, LLM, observability):
    # "langgraph>=0.2",
    # "langchain-anthropic>=0.2",
    # "langfuse>=2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
