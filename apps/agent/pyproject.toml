[project]
name = "weg-verwaltung-agent"
version = "0.1.0"
description = "WEG-Verwaltung KI-Agent-Service (FastAPI + LangGraph)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "supabase>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # LangGraph topology + LLM client + observability (§ 4.1, § 4.6, § 4.8):
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "instructor>=1.7.0",
    "langfuse>=2.50.0",
    # Reserved for HITL graphs (protokoll) — not used by beschluss_graph:
    # "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
